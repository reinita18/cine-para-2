<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cine para 2: una experiencia de cine romántico en casa, creada para una función especial."
    />
    <meta name="theme-color" content="#6b1d2a" />

    <title>Cine para 2</title>

    <link rel="icon" type="image/png" href="./assets/branding/favicon.png" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>

  <body>
    <a class="skip-link" href="#app-main">Saltar al contenido principal</a>

    <header class="site-header" aria-label="Encabezado principal">
      <div class="site-header__inner">
        <button class="brand-button" type="button" data-nav="home" aria-label="Ir al inicio">
          <img
            class="brand-button__icon"
            src="./assets/branding/submarca-icono.png"
            alt=""
            width="56"
            height="56"
          />
          <span>
            <strong>Cine para 2</strong>
            <small>Películas · amor · plan perfecto</small>
          </span>
        </button>

        <nav class="main-nav" aria-label="Navegación principal">
          <button class="main-nav__button" type="button" data-nav="home">Inicio</button>
          <button class="main-nav__button" type="button" data-nav="movies">Cartelera</button>
          <button class="main-nav__button" type="button" data-nav="saved-ticket">Mi boleto</button>
          <button class="main-nav__button main-nav__button--quiet" type="button" data-action="open-reset">
            --
          </button>
        </nav>
      </div>
    </header>

    <main id="app-main" class="app-main" tabindex="-1"></main>

    <footer class="site-footer">
      <p></p>
    </footer>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog id="reset-dialog" class="modal">
      <form method="dialog" class="modal__card">
        <div class="modal__symbol" aria-hidden="true">🎟️</div>
        <h2>¿Reiniciar la experiencia?</h2>
        <p>Se eliminarán la selección actual, el boleto guardado y los pedidos asociados.</p>
        <div class="modal__actions">
          <button class="button button--secondary" value="cancel">Conservar todo</button>
          <button class="button button--danger" value="confirm">Sí, reiniciar</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
